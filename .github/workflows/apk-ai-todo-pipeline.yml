name: AI APK SAST & To-Do Generator

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  static-analysis-todo:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python & Java
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download & Install JADX
        run: |
          pip install google-genai
          wget https://github.com/skylot/jadx/releases/download/v1.5.0/jadx-1.5.0.zip
          unzip jadx-1.5.0.zip -d jadx_bin
          echo "C:\Users\C3ihub\static-analysis-android/jadx_bin/bin" >> 

      - name: Decompile APK
        run: |
          jadx -d decompiled_apk app-release.apk

      - name: Generate AI Security To-Do List
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python .github/scripts/ai_todo_generator.py

      - name: Save To-Do List Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Security-Remediation-ToDo
          path: SECURITY_TODO.md